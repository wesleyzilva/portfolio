<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amazon Loop | Tablet Cue Sheet</title>
  <style>
    /* PALETA AMAZON DARK MODE */
    :root {
      --bg: #000000; --surface: #232F3E; --border: #4A5A6B;
      --orange: #FF9900; --blue: #146EB4; --blue-light: #4AA8FF;
      --text: #FFFFFF; --text-muted: #CCCCCC;
      --success: #00A36C; --danger: #ef4444; --warn: #f59e0b;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg); color: var(--text); padding-top: 140px; padding-bottom: 120px; overflow-x: hidden; }
    
    /* TOP BAR - CONTROLES E CRONÔMETROS */
    .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 55px; background: #000000; border-bottom: 2px solid var(--orange); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    select.recruiter-select { background: var(--surface); color: var(--orange); border: 1px solid var(--border); font-size: 14px; font-weight: 800; padding: 8px 10px; border-radius: 6px; outline: none; max-width: 170px; }
    
    .timers-group { display: flex; align-items: center; gap: 12px; }
    .timer-block { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
    .timer-block.global { padding-right: 12px; border-right: 1px solid var(--border); }
    .timer-lbl { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    
    /* EFEITO PISCANTE (BLINK ALERT) */
    @keyframes blinkAlert {
      0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
      50% { opacity: 0.4; text-shadow: none; }
    }
    .blink-alert { animation: blinkAlert 1.2s ease-in-out infinite; }

    .t-global { font-family: monospace; font-size: 24px; font-weight: 800; transition: color 0.3s; }
    .t-global.pm { color: var(--success); }
    .t-global.tech { color: var(--warn); }
    .t-global.lp { color: var(--danger); }

    .t-local-row { display: flex; align-items: baseline; gap: 4px; }
    .t-local { font-family: monospace; font-size: 20px; font-weight: 800; transition: color 0.3s; }
    .t-local.safe { color: var(--success); }
    .t-local.warn { color: var(--warn); }
    .t-local.danger { color: var(--danger); }
    .t-target { font-family: monospace; font-size: 12px; font-weight: 700; color: #888; }

    /* NAV BAR - BOTÕES DOS PROJETOS */
    .nav-bar { position: fixed; top: 55px; left: 0; right: 0; height: 45px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow-x: auto; white-space: nowrap; z-index: 999; scrollbar-width: none; }
    .nav-bar::-webkit-scrollbar { display: none; }
    .nav-btn { background: #000000; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 6px 16px; border-radius: 16px; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
    
    .nav-btn.star-btn { color: #93C5FD; border-color: rgba(74, 168, 255, 0.4); background: rgba(20, 110, 180, 0.05); }
    .nav-btn.active { background: rgba(255, 153, 0, 0.15) !important; color: #FFF !important; border-color: var(--orange) !important; box-shadow: 0 0 10px rgba(255,153,0,0.4); }

    /* STAGE INDICATOR BAR */
    .stage-bar { position: fixed; top: 100px; left: 0; right: 0; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; z-index: 998; border-bottom: 2px solid rgba(255,255,255,0.1); transition: background 0.3s, color 0.3s; }
    .stage-bar.pm { background: rgba(0, 163, 108, 0.25); color: #6ee7b7; border-bottom-color: var(--success); }
    .stage-bar.tech { background: rgba(245, 158, 11, 0.25); color: #fde047; border-bottom-color: var(--warn); }
    .stage-bar.lp { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border-bottom-color: var(--danger); }

    /* ÁREA DE CONTEÚDO */
    .content-area { padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; }
    .case-header { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .case-num { font-size: 13px; font-weight: 900; color: var(--orange); text-transform: uppercase; letter-spacing: 0.05em; }
    .case-title { font-size: 24px; font-weight: 800; color: #fff; margin-top: 4px; line-height: 1.2; }

    .tags-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .signal-tag { font-size: 11px; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); }
    .tag-highlight { background: rgba(168, 85, 247, 0.2); color: #E8B4FE; border-color: rgba(168, 85, 247, 0.5); }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .info-box { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
    .info-lbl { font-size: 10px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; display: block; }
    .info-val { font-size: 14px; font-weight: 800; color: #FFF; }
    .info-val.prob { color: #fca5a5; } .info-val.budg { color: #86efac; }

    .bait-box { background: rgba(255, 153, 0, 0.1); border: 2px dashed var(--orange); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .bait-title { font-size: 12px; font-weight: 900; color: #FFD280; text-transform: uppercase; }
    .bait-text { font-size: 15px; font-weight: 800; color: #fff; line-height: 1.4; }

    .design-box { background: rgba(20, 110, 180, 0.1); border: 1px solid var(--blue); border-radius: 8px; padding: 14px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .design-title { font-size: 12px; font-weight: 900; color: var(--blue-light); text-transform: uppercase; }
    .design-items { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #fff; }

    .power-phrase { font-size: 18px; font-weight: 700; color: var(--blue-light); font-style: italic; border-left: 4px solid var(--blue); padding-left: 16px; line-height: 1.4; margin-top: 8px;}
    
    .section-title { font-size: 13px; font-weight: 900; color: var(--blue-light); text-transform: uppercase; margin-top: 16px; border-bottom: 1px solid rgba(74, 168, 255, 0.2); padding-bottom: 6px; }
    
    .bullets { list-style: none; display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
    .bullets li { font-size: 16px; color: var(--text-muted); line-height: 1.5; padding-left: 28px; position: relative; }
    .bullets li::before { position: absolute; left: 0; font-size: 16px; top: 1px; }
    .bullets li:nth-child(1)::before { content: "🚨"; }
    .bullets li:nth-child(2)::before { content: "🛠️"; }
    .bullets li:nth-child(3)::before { content: "⚙️"; }
    .bullets li:nth-child(4)::before { content: "🔒"; }
    .bullets li:nth-child(5)::before { content: "🧠"; }
    .bullets li:nth-child(6)::before { content: "✅"; }
    .bullets li strong { color: #fff; }

    .hw-tag { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; margin-top: 4px; border: 1px solid #666; }
    .hw-tag.how { color: #86efac; border-color: rgba(134, 239, 172, 0.4); }
    .hw-tag.why { color: #fca5a5; border-color: rgba(252, 165, 165, 0.4); }

    .spoken-script { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .spoken-line { font-size: 17px; color: #FFF; line-height: 1.5; padding-left: 16px; border-left: 3px solid var(--surface); }
    .spoken-line strong { color: var(--orange); }
    .pulse-check { border-left-color: var(--blue-light) !important; background: rgba(74, 168, 255, 0.08); padding: 10px 14px; border-radius: 0 6px 6px 0; margin-top: 6px; }

    .metrics-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .metric-pill { background: var(--green-bg); border: 1px solid rgba(0,163,108,0.4); color: #6ee7b7; font-size: 14px; font-weight: 800; padding: 8px 12px; border-radius: 4px; }

    .bridge-box { background: rgba(20, 110, 180, 0.15); border-left: 4px solid var(--blue); padding: 16px; font-size: 16px; font-style: italic; color: #FFF; margin-top: 16px; line-height: 1.5; border-radius: 8px; }

    /* FOOTER BAR */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid var(--border); padding: 12px 16px; z-index: 998; box-shadow: 0 -4px 15px rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .footer-tags { text-align: left; color: #E8B4FE; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .footer-lps { text-align: right; color: #FF9900; font-size: 14px; font-weight: 900; white-space: nowrap; flex: 1; }

    /* BOTÃO FAB PLAY/PAUSE */
    .fab-play { position: fixed; bottom: 65px; right: 24px; background: var(--surface); color: #fff; border: 2px solid var(--border); width: 64px; height: 64px; border-radius: 32px; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 997; cursor: pointer; transition: all 0.2s; }
    .fab-play.paused { background: var(--orange); border-color: #FFF; color: #000; }

    /* SESSÃO QUEST 000 - DRAWER LATERAL */
    .quest-btn { position: fixed; right: 0; top: 145px; background: var(--surface); border: 2px solid var(--orange); border-right: none; color: var(--orange); padding: 12px 16px; font-size: 15px; font-weight: 900; border-radius: 8px 0 0 8px; cursor: pointer; z-index: 996; box-shadow: -2px 2px 10px rgba(0,0,0,0.5); transition: 0.2s; }
    .quest-btn:active { background: var(--orange); color: #000; }

    .quest-panel { position: fixed; top: 55px; right: -100%; bottom: 45px; width: 450px; max-width: 90vw; background: #111827; border-left: 2px solid var(--orange); z-index: 1001; overflow-y: auto; padding: 20px; transition: right 0.3s ease-in-out; box-shadow: -5px 0 25px rgba(0,0,0,0.9); }
    .quest-panel.open { right: 0; }
    
    .quest-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .quest-header h2 { color: var(--orange); font-size: 18px; font-weight: 900; }
    .quest-close { background: transparent; border: 1px solid var(--text-muted); color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    .q-section-title { font-size: 13px; font-weight: 900; color: var(--orange); text-transform: uppercase; margin-top: 16px; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 153, 0, 0.3); padding-bottom: 6px; letter-spacing: 0.05em; }
    .q-box { background: rgba(255, 153, 0, 0.05); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
    .q-context { font-size: 14px; color: #a1a1aa; font-style: italic; margin-bottom: 4px; line-height: 1.3; }
    .q-item { font-size: 15px; color: #FFF; line-height: 1.4; padding-left: 12px; border-left: 3px solid var(--orange); }
    .q-global-highlight { border-left-color: var(--blue-light); background: rgba(74, 168, 255, 0.05); }
  </style>
</head>
<body onclick="initWakeLock()">
  
  <div class="top-bar">
    <select id="recruiterSelect" class="recruiter-select" onclick="event.stopPropagation()" onchange="changeRecruiter()">

  <script>
    const db = [
      // --- INTROS & FINISH ---
      {
        id: "intro0", num: "000", title: "Opener & Roadmap", target: "01:00", tags: ["ALL", "NAKAGAWA", "BICUDO", "CORDEIRO", "RICARTE", "SALLES"], type: "script", signals: [],
        phrase: "I would like to propose an agenda for our meeting, unless you already have something in mind...",
        scriptLines: [

          "<strong>I just dropped a link in the chat to my Executive Dashboard</strong> so you can review my architectural mindset asynchronously. I believe this could be a great approach. Let me know what you think.",

      },
      {
        id: "intro1", num: "001", title: "Bernardin & XBot", target: "01:20", tags: ["ALL", "NAKAGAWA", "BICUDO", "CORDEIRO", "RICARTE", "SALLES"], type: "script", signals: ["BUILD FROM SCRATCH"],
        phrase: "We couldn't wait for the market, so I built a sales pipeline leveraging relationships and technical blueprint kits.",
        scriptLines: [
          "In 2009, my professional English foundation was sparked at Bernardin prospecting the Brazilian market for Europe.",

          "<div class='bridge-box' style='margin-left: -16px; margin-top: 10px; border-radius: 0 8px 8px 0;'>🌉 <strong>THE BRIDGE:</strong> We also founded a game challenge with an association that proved we were unique in the Brazilian market, generating <strong>BRL 4M+ in sales</strong> and opening 10 positions in production.</div>",
          "<div class='spoken-line pulse-check'>💬 <strong>PULSE CHECK (Business Alignment):</strong> \"Before we move on: Does this Latam TPM role connect heavily with external business partners and commercial go-to-market dynamics, or is it strictly focused on internal engineering systems?\"</div>"
        ]
      },
      {
        id: "intro2", num: "002", title: "Amdocs & 10Y Serasa", target: "01:30", tags: ["ALL", "NAKAGAWA", "BICUDO", "CORDEIRO", "RICARTE", "SALLES"], type: "script", signals: ["ENTERPRISE SCALE"],

          "<div class='spoken-line pulse-check'>💬 <strong>PULSE CHECK (Scope Alignment & Pivot):</strong> \"Looking across this arc—from legacy reverse-engineering and scaling squads to M&A and payments—is there a specific layer you’d like me to focus on today? I want to make sure the canonical cases I highlight directly hit your expectations.\"</div>"

      {
        id: "intro4", num: "004", title: "Wrap Up & Next Steps", target: "01:30", tags: ["ALL", "NAKAGAWA", "BICUDO", "CORDEIRO", "RICARTE", "SALLES"], type: "script", signals: ["CLOSING"],

      {

    }

      try { 
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); 
      } catch (err) { console.log('WakeLock error:', err); } 
    }
    
    changeRecruiter();
  </script>
</body>
