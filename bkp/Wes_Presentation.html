<head>

  <style>
    :root {
      /* PALETA AMAZON / SLIDE DECK */
      --bg-page: #0b0f14;
      --card-bg: #1A222C;
      --card-border: #37475A;
      --aws-orange: #FF9900;
      --aws-blue: #146EB4;
      --aws-light-blue: #4AA8FF;
      --text-main: #FFFFFF;
      --text-muted: #CCCCCC;
      --success: #00A36C;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-page); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-y: scroll; }
    
    /* CABEÇALHO FIXO */
    header { background: #232F3E; border-bottom: 2px solid var(--aws-orange); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .branding { display: flex; align-items: center; gap: 12px; }
    .branding h1 { font-size: 20px; font-weight: 800; margin: 0; color: #FFF; }
    .branding span { background: var(--aws-orange); color: #000; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    
    .btn-back { display: none; background: transparent; border: 1px solid var(--aws-orange); color: var(--aws-orange); font-size: 14px; font-weight: 800; padding: 6px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-back:hover { background: var(--aws-orange); color: #000; }

    /* ÁREA PRINCIPAL */
    main { flex: 1; display: flex; justify-content: center; padding: 40px 32px; align-items: flex-start; }
    
    /* VIEW 1: A MATRIZ (12 CARDS) */
    #viewMatrix { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; animation: fadeIn 0.4s ease-out; }
    
    .matrix-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
    .matrix-card:hover { transform: translateY(-6px); border-color: var(--aws-orange); box-shadow: 0 10px 25px rgba(255, 153, 0, 0.15); }
    .matrix-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--card-border); transition: background 0.3s; }
    .matrix-card:hover::before { background: var(--aws-orange); }
    
    .mc-id { font-size: 12px; font-weight: 900; color: var(--aws-orange); text-transform: uppercase; letter-spacing: 0.05em; }
    .mc-title { font-size: 18px; font-weight: 800; color: #FFF; line-height: 1.2; }
    .mc-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
    
    /* Highlight especial para o Card "About Wes" e "Startup" */
    .matrix-card.card-about::before { background: var(--aws-blue); }
    .matrix-card.card-about:hover::before { background: var(--aws-light-blue); }
    .matrix-card.card-about:hover { border-color: var(--aws-light-blue); box-shadow: 0 10px 25px rgba(74, 168, 255, 0.15); }
    .matrix-card.card-about .mc-id { color: var(--aws-light-blue); }

    .matrix-card.card-idea::before { background: #FFD700; }
    .matrix-card.card-idea:hover { border-color: #FFD700; box-shadow: 0 10px 25px rgba(255, 215, 0, 0.15); }

    /* VIEW 2: ONE-PAGER SLIDE */
    #viewSlide { display: none; width: 100%; max-width: 1200px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); animation: fadeIn 0.4s ease-out; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    /* ESTILOS DO SLIDE */
    .slide-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--card-border); padding-bottom: 20px; margin-bottom: 24px; }
    .slide-title-block { display: flex; flex-direction: column; gap: 8px; }
    .slide-id { font-size: 15px; font-weight: 900; color: var(--aws-orange); letter-spacing: 0.05em; text-transform: uppercase; }
    .slide-title { font-size: 36px; font-weight: 800; color: #FFF; line-height: 1.1; }
    .tags-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .tag { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; border: 1px solid; }
    .tag-award { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.4); }
    .tag-stack { color: #86efac; background: rgba(134, 239, 172, 0.1); border-color: rgba(134, 239, 172, 0.4); }
    .tag-ai { color: #E8B4FE; background: rgba(232, 180, 254, 0.1); border-color: rgba(232, 180, 254, 0.4); }
    .tag-idea { color: #FFD700; background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.6); box-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
    .tag-blue { color: var(--aws-light-blue); background: rgba(74, 168, 255, 0.1); border-color: rgba(74, 168, 255, 0.4); }

    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
    .context-box { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); padding: 20px; border-radius: 8px; }
    .context-label { font-size: 13px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; }
    .context-val { font-size: 17px; font-weight: 600; color: #FFF; line-height: 1.4; }
    .val-prob { color: #fca5a5; }
    .val-budg { color: #86efac; }

    .execution-title { font-size: 18px; font-weight: 900; color: var(--aws-light-blue); text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid rgba(74, 168, 255, 0.2); padding-bottom: 8px; }
    .bullets-list { display: flex; flex-direction: column; gap: 20px; list-style: none; }
    .bullets-list li { font-size: 18px; color: var(--text-muted); position: relative; padding-left: 36px; line-height: 1.5; }
    .bullets-list li::before { position: absolute; left: 0; top: 2px; font-size: 20px; }
    .bullets-list li.b-sit::before { content: "📍"; } 
    .bullets-list li.b-act::before { content: "⚡"; } 
    .bullets-list li.b-les::before { content: "🧠"; } 
    .bullets-list li.b-res::before { content: "🎯"; } 
    .bullets-list li strong { color: #FFF; }

    .hw-container { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--card-border); }
    .hw-tag { display: inline-block; font-size: 15px; line-height: 1.4; }
    .hw-how { color: #a7f3d0; }
    .hw-why { color: #fecaca; }
    .hw-tag strong { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
    .hw-how strong { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .hw-why strong { background: rgba(248, 113, 113, 0.2); color: #f87171; }

    .design-specs { background: rgba(20, 110, 180, 0.1); border: 1px solid var(--aws-blue); border-radius: 8px; padding: 20px; margin-bottom: 32px; }
    .design-title { font-size: 14px; font-weight: 900; color: var(--aws-light-blue); text-transform: uppercase; margin-bottom: 10px; display: block; }
    .design-items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 16px; color: #FFF; }

    .impact-footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; }
    .impact-label { font-size: 16px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; }
    .metrics-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .metric-chip { background: rgba(0, 163, 108, 0.15); border: 1px solid var(--success); color: #6ee7b7; font-size: 18px; font-weight: 800; padding: 10px 20px; border-radius: 6px; }

    @media (max-width: 1100px) {

    }
    @media (max-width: 800px) {
      #viewMatrix { grid-template-columns: repeat(2, 1fr); }
      .context-grid { grid-template-columns: 1fr; }
      .design-items { grid-template-columns: 1fr; }
      .impact-footer { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>

    function renderMatrix() {
      const container = document.getElementById('viewMatrix');
      container.innerHTML = '';
      
      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = `matrix-card ${p.isAbout ? 'card-about' : ''} ${p.id === '11' ? 'card-idea' : ''}`;
        card.onclick = () => openSlide(p.id);
        
        let titleLabel = p.isAbout ? p.title : p.title;
        let idLabel = p.isAbout ? 'Profile' : `STAR ${p.id}`;

        card.innerHTML = `
          <span class="mc-id">${idLabel} • ${p.year}</span>
          <div class="mc-title">${titleLabel}</div>
          <div class="mc-desc">${p.desc}</div>
        `;
        container.appendChild(card);
      });
    }

    function openSlide(id) {
      document.getElementById('viewMatrix').style.display = 'none';
      document.getElementById('viewSlide').style.display = 'block';
      document.getElementById('btnBack').style.display = 'block';
      window.scrollTo(0,0);

      const p = projects.find(x => x.id === id);
      if (!p) return;

      const tagsHtml = p.tags.map(t => `<span class="tag ${t.class}">${t.label}</span>`).join('');
      
      let specsHtml = '';
      if(p.designSpecs) {
        specsHtml = `
          <div class="design-specs">
            <span class="design-title">${p.designSpecs.title}</span>
            <div class="design-items">${p.designSpecs.items.map(i => `<span>${i}</span>`).join('')}</div>
          </div>
        `;
      }

      const bulletsHtml = p.bullets.join('');
      const metricsHtml = p.metrics.map(m => `<span class="metric-chip">${m}</span>`).join('');

      // Labels mudam um pouco para o "About Wes"
      const lblProb = p.isAbout ? '🎯 Core Objective' : '🚨 Problem to Solve';
      const lblBudg = p.isAbout ? '👤 Personal Matrix' : '💰 Scale / Budget';
      const idPrefix = p.isAbout ? '' : 'STAR ';

      const html = `
        <div class="slide-header">
          <div class="slide-title-block">
            <span class="slide-id">${idPrefix}${p.id} • ${p.year}</span>
            <h2 class="slide-title">${p.title}</h2>
            <div class="tags-container">${tagsHtml}</div>
          </div>
        </div>
        
        <div class="context-grid">
          <div class="context-box">
            <span class="context-label">${lblProb}</span>
            <span class="context-val val-prob">${p.problem}</span>
          </div>
          <div class="context-box">
            <span class="context-label">${lblBudg}</span>
            <span class="context-val val-budg">${p.budget}</span>
          </div>
        </div>

        ${specsHtml}

        <div class="execution-title">${p.isAbout ? 'Background & Discipline' : 'Execution (S.T.A.R Framework)'}</div>
        <ul class="bullets-list">
          ${bulletsHtml}
        </ul>

        <div class="impact-footer">
          <span class="impact-label">${p.isAbout ? 'Core Strengths' : 'Business Impact'}</span>
          <div class="metrics-group">
            ${metricsHtml}
          </div>
        </div>
      `;

      const container = document.getElementById('viewSlide');
      container.style.animation = 'none';
      container.offsetHeight; 
      container.style.animation = null; 
      container.innerHTML = html;
    }

    function goHome() {
      document.getElementById('viewSlide').style.display = 'none';
      document.getElementById('btnBack').style.display = 'none';
      
      const matrix = document.getElementById('viewMatrix');
      matrix.style.display = 'grid';
      matrix.style.animation = 'none';
      matrix.offsetHeight; 
      matrix.style.animation = null; 
      window.scrollTo(0,0);
    }

    // Inicializa a matriz
    renderMatrix();
  </script>
